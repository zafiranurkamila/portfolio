    />

  <body style="background:#3b2a1d">
    <div id="root">
      <!-- layar tunggu: tampil sebelum JavaScript selesai diunduh -->

    <style>
      .boot-block {
        width: 44px;
        height: 44px;
        background: linear-gradient(#6aaa45 0 30%, #866043 30%);
        border: 3px solid #1e140b;
        box-shadow: inset -6px -6px 0 rgba(0, 0, 0, 0.25);
        animation: boot 0.9s ease-in-out infinite;
      }
      @keyframes boot {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-14px) rotate(90deg); }
      }
    </style>
